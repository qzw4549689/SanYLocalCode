<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务进度看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5; color: #1f2329; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: #fff; border-bottom: 1px solid #e5e6eb;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .spacer { flex: 1; }
  .btn {
    border: 1px solid #d9dbe0; background: #fff; border-radius: 6px;
    padding: 6px 14px; font-size: 13px; cursor: pointer; color: #1f2329;
  }
  .btn:hover { background: #f2f3f5; }
  .btn-primary { background: #1664ff; border-color: #1664ff; color: #fff; }
  .btn-primary:hover { background: #0e54e0; }
  .refresh-info { font-size: 12px; color: #8f959e; }

  .board { display: flex; gap: 14px; padding: 16px 20px; flex: 1; min-height: 0; }
  .column {
    flex: 1; background: #e9ebef; border-radius: 10px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .column-header {
    padding: 12px 14px; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .column-header .dot { width: 8px; height: 8px; border-radius: 50%; }
  .column-header .count {
    background: rgba(0,0,0,.08); border-radius: 10px;
    font-size: 12px; padding: 1px 8px; font-weight: 500;
  }
  .col-pending .dot { background: #8f959e; }
  .col-in_progress .dot { background: #1664ff; }
  .col-pending_release .dot { background: #ff7d00; }
  .cards { flex: 1; overflow-y: auto; padding: 0 10px 10px; }

  .card {
    background: #fff; border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; cursor: pointer; border: 1px solid transparent;
    transition: box-shadow .15s;
  }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); border-color: #1664ff; }
  .card .card-id { font-size: 12px; color: #1664ff; font-weight: 600; }
  .card .card-title { font-size: 14px; font-weight: 500; margin: 3px 0; word-break: break-all; }
  .card .card-desc {
    font-size: 12px; color: #646a73; margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .card-time { font-size: 11px; color: #8f959e; }
  .empty-tip { text-align: center; color: #8f959e; font-size: 12px; padding: 20px 0; }

  /* 历史记录抽屉 */
  .history-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 90vw;
    background: #fff; box-shadow: -4px 0 16px rgba(0,0,0,.12);
    transform: translateX(100%); transition: transform .2s; z-index: 50;
    display: flex; flex-direction: column;
  }
  .history-panel.open { transform: translateX(0); }
  .history-panel .panel-header {
    padding: 14px 18px; border-bottom: 1px solid #e5e6eb;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 15px;
  }
  .history-list { flex: 1; overflow-y: auto; padding: 12px 18px; }
  .history-item {
    border: 1px solid #e5e6eb; border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; cursor: pointer;
  }
  .history-item:hover { border-color: #1664ff; }
  .history-item .badge-released {
    display: inline-block; font-size: 11px; color: #00a870;
    background: #e8f7f0; border-radius: 4px; padding: 1px 6px; margin-left: 6px;
  }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; width: 480px; max-width: 92vw;
    max-height: 85vh; overflow-y: auto; padding: 20px 22px;
  }
  .modal h3 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .modal .form-row { margin-bottom: 12px; }
  .modal label { display: block; font-size: 12px; color: #646a73; margin-bottom: 4px; }
  .modal input[type=text], .modal textarea {
    width: 100%; border: 1px solid #d9dbe0; border-radius: 6px;
    padding: 7px 10px; font-size: 14px; font-family: inherit;
  }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .status-flow { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .status-btn {
    border: 1px solid #d9dbe0; background: #fff; border-radius: 6px;
    padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .status-btn:hover { border-color: #1664ff; color: #1664ff; }
  .status-btn.current { background: #1664ff; color: #fff; border-color: #1664ff; cursor: default; }
  .timeline { margin-top: 12px; border-top: 1px solid #f0f0f0; padding-top: 10px; }
  .timeline-item { font-size: 12px; color: #646a73; padding: 4px 0 4px 14px; position: relative; }
  .timeline-item::before {
    content: ""; position: absolute; left: 0; top: 9px;
    width: 6px; height: 6px; border-radius: 50%; background: #1664ff;
  }
  .timeline-item .t-time { color: #8f959e; margin-right: 6px; }
  .btn-danger { color: #d83931; border-color: #f2bab6; }
  .btn-danger:hover { background: #fdeceA; }

  /* Tab 切换 */
  .tabs { display: flex; gap: 4px; margin-left: 12px; }
  .tab-btn {
    border: none; background: transparent; padding: 7px 14px; font-size: 14px;
    cursor: pointer; color: #646a73; border-bottom: 2px solid transparent; border-radius: 0;
  }
  .tab-btn.active { color: #1664ff; border-bottom-color: #1664ff; font-weight: 600; }

  /* 发布清单视图 */
  #releaseView { flex: 1; overflow-y: auto; padding: 16px 20px; display: none; }
  .release-toolbar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    font-size: 12px; color: #8f959e;
  }
  .pkg-group {
    background: #fff; border-radius: 10px; margin-bottom: 14px;
    border: 1px solid #e5e6eb; overflow: hidden;
  }
  .pkg-header {
    padding: 12px 16px; background: #f7f8fa; border-bottom: 1px solid #e5e6eb;
    display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px;
    cursor: pointer; user-select: none;
  }
  .pkg-header:hover { background: #f0f2f5; }
  .pkg-header .collapse-arrow {
    font-size: 12px; color: #8f959e; transition: transform .15s; flex-shrink: 0;
  }
  .pkg-group.collapsed .collapse-arrow { transform: rotate(-90deg); }
  .pkg-group.collapsed .pkg-items { display: none; }
  .pkg-group.collapsed .pkg-header { border-bottom: none; }
  .pkg-header .pkg-badge {
    font-size: 11px; font-weight: 400; border-radius: 4px; padding: 2px 8px;
  }
  .pkg-badge-new { background: #e8f0ff; color: #1664ff; }
  .pkg-badge-fixed { background: #f0f0f0; color: #646a73; }
  .pkg-badge-manual { background: #fff3e0; color: #d46b08; }
  .pkg-header .pkg-count { font-size: 12px; color: #8f959e; font-weight: 400; }
  .entity-subhead {
    font-weight: 600; color: #374151; font-size: 13px;
    padding: 6px 16px 4px; background: #fafbfc; border-top: 1px dashed #e5e6eb;
    cursor: pointer; user-select: none;
  }
  .entity-subhead:hover { background: #f0f2f5; }
  .entity-subhead .sub-arrow { font-size: 11px; color: #8f959e; transition: transform .15s; }
  .entity-subgroup.collapsed .entity-subhead .sub-arrow { transform: rotate(-90deg); display: inline-block; }
  .entity-subgroup.collapsed .entity-subitems { display: none; }
  .pkg-header .pkg-release-btn {
    margin-left: auto; border: 1px solid #b7eb8f; background: #f6ffed; color: #389e0d;
    border-radius: 6px; padding: 3px 12px; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
  .pkg-header .pkg-release-btn:hover { background: #d9f7be; }
  .pkg-items { padding: 6px 0; }
  .pkg-item {
    padding: 8px 16px; display: flex; align-items: baseline; gap: 10px;
    border-bottom: 1px solid #f5f5f5; font-size: 13px;
  }
  .pkg-item:last-child { border-bottom: none; }
  .pkg-item .in-pkg { flex-shrink: 0; font-size: 12px; }
  .in-pkg-yes { color: #00a870; }
  .in-pkg-no { color: #d46b08; }
  .pkg-item .item-comp { font-weight: 600; color: #1f2329; word-break: break-all; }
  .pkg-item .item-summary { color: #646a73; flex: 1; word-break: break-all; }
  .pkg-item .item-ref { flex-shrink: 0; font-size: 12px; color: #1664ff; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>📋 任务进度看板</h1>
  <nav class="tabs">
    <button class="tab-btn active" id="tabTasks" onclick="switchTab('tasks')">任务看板</button>
    <button class="tab-btn" id="tabRelease" onclick="switchTab('release')">📦 发布清单</button>
  </nav>
  <span class="refresh-info" id="refreshInfo"></span>
  <button class="btn" id="refreshBtn" title="刷新任务看板">🔄 刷新</button>
  <div class="spacer"></div>
  <button class="btn" id="historyBtn">📦 历史记录</button>
  <button class="btn btn-primary" id="newTaskBtn">＋ 录入任务</button>
</header>

<div class="board" id="taskView">
  <div class="column col-pending">
    <div class="column-header"><span class="dot"></span>待处理 <span class="count" id="count-pending">0</span></div>
    <div class="cards" id="col-pending"></div>
  </div>
  <div class="column col-in_progress">
    <div class="column-header"><span class="dot"></span>开发中 <span class="count" id="count-in_progress">0</span></div>
    <div class="cards" id="col-in_progress"></div>
  </div>
  <div class="column col-pending_release">
    <div class="column-header"><span class="dot"></span>待发布 <span class="count" id="count-pending_release">0</span></div>
    <div class="cards" id="col-pending_release"></div>
  </div>
</div>

<!-- 发布清单视图 -->
<div id="releaseView">
  <div class="release-toolbar">
    <span id="releaseSyncInfo">尚未同步</span>
    <button class="btn" onclick="loadRelease()" title="刷新发布清单">🔄 刷新</button>
    <div style="flex:1"></div>
    <button class="btn" onclick="toggleAllGroups(false)">展开全部</button>
    <button class="btn" onclick="toggleAllGroups(true)">收起全部</button>
    <button class="btn btn-danger" id="releaseDoneBtn">✅ 本批已全部发布</button>
  </div>
  <div id="releaseGroups"></div>
</div>

<!-- 历史记录抽屉 -->
<div class="history-panel" id="historyPanel">
  <div class="panel-header">
    <span>📦 已发布 · 历史记录</span>
    <button class="btn" id="historyClose">✕</button>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

<!-- 新建任务弹窗 -->
<div class="modal-mask" id="newModal">
  <div class="modal">
    <h3>＋ 录入新任务</h3>
    <div class="form-row">
      <label>标题 *</label>
      <input type="text" id="newTitle" placeholder="例如：修复禅道 Bug #1560 合同可编辑问题">
    </div>
    <div class="form-row">
      <label>描述（可记禅道 Bug 号、相关组件、发版包等）</label>
      <textarea id="newDesc" placeholder="补充信息..."></textarea>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeModal('newModal')">取消</button>
      <button class="btn btn-primary" id="createBtn">创建</button>
    </div>
  </div>
</div>

<!-- 任务详情弹窗 -->
<div class="modal-mask" id="detailModal">
  <div class="modal">
    <h3><span id="detailId" style="color:#1664ff"></span><span id="detailTitleText"></span></h3>
    <div class="form-row">
      <label>标题</label>
      <input type="text" id="detailTitle">
    </div>
    <div class="form-row">
      <label>描述</label>
      <textarea id="detailDesc"></textarea>
    </div>
    <div class="form-row">
      <label>状态（点击切换）</label>
      <div class="status-flow" id="statusFlow"></div>
    </div>
    <div class="timeline" id="detailTimeline"></div>
    <div class="actions">
      <button class="btn btn-danger" id="deleteBtn" style="margin-right:auto">删除</button>
      <button class="btn" onclick="closeModal('detailModal')">关闭</button>
      <button class="btn btn-primary" id="saveBtn">保存修改</button>
    </div>
  </div>
</div>

<script>
const STATUS_LABELS = {
  pending: "待处理",
  in_progress: "开发中",
  pending_release: "待发布",
  released: "已发布"
};
const COLUMNS = ["pending", "in_progress", "pending_release"];
let allTasks = [];
let currentTaskId = null;
let pendingStatus = null; // 详情弹窗里暂存待切换的状态

async function api(path, method, body) {
  const opt = { method: method || "GET", headers: {} };
  if (body !== undefined) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  const resp = await fetch(path, opt);
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));
  return data;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function shortTime(ts) {
  return (ts || "").slice(5, 16); // MM-DD HH:mm
}

async function refresh() {
  try {
    const data = await api("/api/tasks");
    allTasks = data.tasks;
    render();
    document.getElementById("refreshInfo").textContent =
      "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (e) {
    document.getElementById("refreshInfo").textContent = "连接失败: " + e.message;
  }
}

function render() {
  for (const col of COLUMNS) {
    const tasks = allTasks.filter(t => t.status === col);
    document.getElementById("count-" + col).textContent = tasks.length;
    const box = document.getElementById("col-" + col);
    box.innerHTML = tasks.length
      ? tasks.map(t => `
        <div class="card" onclick="openDetail('${t.id}')">
          <div class="card-id">${t.id}</div>
          <div class="card-title">${escapeHtml(t.title)}</div>
          ${t.description ? `<div class="card-desc">${escapeHtml(t.description)}</div>` : ""}
          <div class="card-time">更新 ${shortTime(t.updated_at)}</div>
        </div>`).join("")
      : '<div class="empty-tip">暂无任务</div>';
  }
}

async function openDetail(id) {
  try {
    const t = await api("/api/tasks/" + encodeURIComponent(id));
    currentTaskId = t.id;
    pendingStatus = null;
    document.getElementById("detailId").textContent = t.id;
    document.getElementById("detailTitleText").textContent = "";
    document.getElementById("detailTitle").value = t.title;
    document.getElementById("detailDesc").value = t.description || "";
    renderStatusFlow(t.status);
    const tl = document.getElementById("detailTimeline");
    tl.innerHTML = (t.history || []).map(h => `
      <div class="timeline-item">
        <span class="t-time">${h.changed_at}</span>
        ${h.from_status ? STATUS_LABELS[h.from_status] + " → " : ""}${STATUS_LABELS[h.to_status]}
        ${h.note ? "（" + escapeHtml(h.note) + "）" : ""}
      </div>`).join("");
    openModal("detailModal");
  } catch (e) { alert(e.message); }
}

function renderStatusFlow(current) {
  const box = document.getElementById("statusFlow");
  box.innerHTML = Object.keys(STATUS_LABELS).map(s =>
    `<button class="status-btn ${s === current ? "current" : ""}" data-status="${s}">${STATUS_LABELS[s]}</button>`
  ).join("");
  box.querySelectorAll(".status-btn").forEach(btn => {
    btn.onclick = () => {
      pendingStatus = btn.dataset.status;
      box.querySelectorAll(".status-btn").forEach(b => b.classList.remove("current"));
      btn.classList.add("current");
    };
  });
}

async function saveDetail() {
  if (!currentTaskId) return;
  const body = {
    title: document.getElementById("detailTitle").value,
    description: document.getElementById("detailDesc").value
  };
  if (pendingStatus) body.status = pendingStatus;
  try {
    await api("/api/tasks/" + encodeURIComponent(currentTaskId), "PATCH", body);
    closeModal("detailModal");
    await refresh();
  } catch (e) { alert(e.message); }
}

async function deleteCurrent() {
  if (!currentTaskId) return;
  if (!confirm("确认删除任务 " + currentTaskId + "？此操作不可恢复。")) return;
  try {
    await api("/api/tasks/" + encodeURIComponent(currentTaskId), "DELETE");
    closeModal("detailModal");
    await refresh();
  } catch (e) { alert(e.message); }
}

async function createTask() {
  const title = document.getElementById("newTitle").value.trim();
  if (!title) { alert("请填写标题"); return; }
  try {
    await api("/api/tasks", "POST", {
      title, description: document.getElementById("newDesc").value
    });
    document.getElementById("newTitle").value = "";
    document.getElementById("newDesc").value = "";
    closeModal("newModal");
    await refresh();
  } catch (e) { alert(e.message); }
}

async function loadHistory() {
  const box = document.getElementById("historyList");
  box.innerHTML = '<div class="empty-tip">加载中...</div>';
  try {
    const data = await api("/api/tasks?status=released");
    const tasks = data.tasks.slice().reverse(); // 最新在前
    box.innerHTML = tasks.length
      ? tasks.map(t => `
        <div class="history-item" onclick="openDetail('${t.id}')">
          <span style="color:#1664ff;font-weight:600;font-size:12px">${t.id}</span>
          <span class="badge-released">已发布</span>
          <div style="font-size:14px;margin:4px 0">${escapeHtml(t.title)}</div>
          <div style="font-size:11px;color:#8f959e">发布于 ${shortTime(t.updated_at)}</div>
        </div>`).join("")
      : '<div class="empty-tip">暂无已发布任务</div>';
  } catch (e) {
    box.innerHTML = '<div class="empty-tip">加载失败: ' + escapeHtml(e.message) + "</div>";
  }
}

function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }

// ---------------- 发布清单视图 ----------------

const FIXED_PACKAGES = {
  webresource: "McsWebResource",
  plugin: "McsPlugin",
  customapi: "McsCustomAPI"
};
const PKG_ORDER = ["entity", "webresource", "plugin", "customapi", "config", "manual"];
const SECTION_LABELS = { config: "⚙️ 配置数据（不随 Solution，各环境手动）", manual: "🖐️ 手动步骤 / 其他" };

function todayEntityPkg() {
  const d = new Date();
  const ymd = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  return "entity_" + ymd + "_peter";
}

function switchTab(tab) {
  document.getElementById("tabTasks").classList.toggle("active", tab === "tasks");
  document.getElementById("tabRelease").classList.toggle("active", tab === "release");
  document.getElementById("taskView").classList.toggle("hidden", tab !== "tasks");
  document.getElementById("releaseView").style.display = tab === "release" ? "block" : "none";
  if (tab === "release") loadRelease();
}

async function loadRelease() {
  const box = document.getElementById("releaseGroups");
  box.innerHTML = '<div class="empty-tip">加载中...</div>';
  try {
    const data = await api("/api/release-items");
    document.getElementById("releaseSyncInfo").textContent = data.synced_at
      ? "最近登记于 " + data.synced_at
      : "暂无待发布内容（AI 开发完成后逐项登记）";
    renderRelease(data.items);
  } catch (e) {
    box.innerHTML = '<div class="empty-tip">加载失败: ' + escapeHtml(e.message) + "</div>";
  }
}

function renderRelease(items) {
  const box = document.getElementById("releaseGroups");
  if (!items.length) {
    box.innerHTML = '<div class="empty-tip">当前没有待发布内容 🎉</div>';
    return;
  }
  // 解析每项的包归属
  const groups = {}; // key -> {title, badge, badgeClass, section, pkgName, items}
  for (const it of items) {
    let key, title, badge, badgeClass, pkgName = "";
    if (it.section === "entity") {
      if (it.package) {
        key = "pkg:" + it.package;
        title = "📁 " + it.package;
        badge = "用户指定包";
        pkgName = it.package;
      } else {
        key = "pkg:default";
        title = "📁 " + todayEntityPkg();
        badge = "新建包 · 按今天日期";
        pkgName = "";
      }
      badgeClass = "pkg-badge-new";
    } else if (FIXED_PACKAGES[it.section]) {
      key = "pkg:" + FIXED_PACKAGES[it.section];
      title = "📁 " + FIXED_PACKAGES[it.section];
      badge = "固定包";
      badgeClass = "pkg-badge-fixed";
      pkgName = FIXED_PACKAGES[it.section];
    } else if (it.package) {
      // config/manual 项指定了 package 时按包名归组（如 Azure 环节 MessageHandler）
      key = "pkg:" + it.package;
      title = "📁 " + it.package;
      badge = "手动执行";
      badgeClass = "pkg-badge-manual";
      pkgName = it.package;
    } else {
      key = "sec:" + it.section;
      title = SECTION_LABELS[it.section] || it.section;
      badge = "手动执行";
      badgeClass = "pkg-badge-manual";
    }
    if (!groups[key]) groups[key] = { title, badge, badgeClass, section: it.section, pkgName, items: [] };
    groups[key].items.push(it);
  }
  // 按分区顺序排序
  const sorted = Object.values(groups).sort(
    (a, b) => PKG_ORDER.indexOf(a.section) - PKG_ORDER.indexOf(b.section)
  );
  const itemRow = (g, it) => `
          <div class="pkg-item">
            ${(g.section === "config" || g.section === "manual") ? "" :
              `<span class="in-pkg ${it.in_package ? "in-pkg-yes" : "in-pkg-no"}">${it.in_package ? "✅ 已在包" : "⏸️ 待加入"}</span>`}
            <span class="item-comp">${escapeHtml(it.component)}</span>
            <span class="item-summary" title="${escapeHtml(it.summary)}">${escapeHtml(it.summary)}</span>
            <span class="item-ref">${escapeHtml(it.ref)}</span>
          </div>`;
  // entity 包内按实体逻辑名（组件名首个词）子分组
  const entityOf = c => { const m = (c || "").match(/^[a-z][a-z0-9_]*/i); return m ? m[0] : "（其他）"; };
  const renderItems = g => {
    if (g.section !== "entity") return g.items.map(it => itemRow(g, it)).join("");
    const subs = {};
    g.items.forEach(it => (subs[entityOf(it.component)] = subs[entityOf(it.component)] || []).push(it));
    return Object.keys(subs).sort().map(e =>
      `<div class="entity-subgroup collapsed">` +
      `<div class="entity-subhead" onclick="this.parentElement.classList.toggle('collapsed')"><span class="sub-arrow">▼</span> ${escapeHtml(e)}（${subs[e].length} 项）</div>` +
      `<div class="entity-subitems">` + subs[e].map(it => itemRow(g, it)).join("") + `</div>` +
      `</div>`
    ).join("");
  };
  box.innerHTML = sorted.map(g => {
    // 归档参数：entity 传包名（默认新包传空串），固定包传 package，配置/手动传 section
    let releaseArg;
    if (g.section === "entity") releaseArg = { section: "entity", package: g.pkgName || "" };
    else if (g.pkgName) releaseArg = { package: g.pkgName };
    else releaseArg = { section: g.section };
    return `
    <div class="pkg-group collapsed">
      <div class="pkg-header" onclick="toggleGroup(this)">
        <span class="collapse-arrow">▼</span>
        ${g.title}
        <span class="pkg-badge ${g.badgeClass}">${g.badge}</span>
        <span class="pkg-count">${g.items.length} 项 · ${g.items.filter(i => i.in_package).length} 已入包</span>
        <button class="pkg-release-btn" data-release='${JSON.stringify(releaseArg)}' data-name="${escapeHtml(g.pkgName || SECTION_LABELS[g.section] || g.section)}">✅ 已发布</button>
      </div>
      <div class="pkg-items">
        ${renderItems(g)}
      </div>
    </div>`;
  }).join("");
  box.querySelectorAll(".pkg-release-btn").forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      releaseGroup(JSON.parse(btn.dataset.release), btn.dataset.name);
    };
  });
}

function toggleGroup(headerEl) {
  headerEl.parentElement.classList.toggle("collapsed");
}

async function releaseGroup(arg, name) {
  if (!confirm("确认「" + name + "」已发布？其包含的发布项将从清单中归档移除。")) return;
  try {
    const r = await api("/api/release-items/release", "POST", arg);
    if (r.released === 0) alert("该分组没有可归档的待发布项");
    await loadRelease();
  } catch (e) { alert(e.message); }
}

async function releaseBatch() {
  if (!confirm("确认本批次全部内容已发布？确认后发布清单将清空归档。")) return;
  try {
    const r = await api("/api/release-items/release", "POST", {});
    alert("已归档 " + r.released + " 项（" + r.released_at + "）");
    await loadRelease();
  } catch (e) { alert(e.message); }
}

function toggleAllGroups(collapse) {
  document.querySelectorAll("#releaseGroups .pkg-group").forEach(g =>
    g.classList.toggle("collapsed", collapse));
}
document.getElementById("releaseDoneBtn").onclick = releaseBatch;

document.getElementById("refreshBtn").onclick = refresh;
document.getElementById("newTaskBtn").onclick = () => openModal("newModal");
document.getElementById("createBtn").onclick = createTask;
document.getElementById("saveBtn").onclick = saveDetail;
document.getElementById("deleteBtn").onclick = deleteCurrent;
document.getElementById("historyBtn").onclick = () => {
  document.getElementById("historyPanel").classList.add("open");
  loadHistory();
};
document.getElementById("historyClose").onclick = () =>
  document.getElementById("historyPanel").classList.remove("open");
document.querySelectorAll(".modal-mask").forEach(m => {
  m.addEventListener("click", e => { if (e.target === m) m.classList.remove("open"); });
});

refresh();
setInterval(refresh, 10000); // 每 10 秒自动刷新
</script>
</body>
</html>
