        // 动态卸载脚本
        function unloadScript(scriptId) {
            var scriptElement = document.getElementById(scriptId);
            if (scriptElement) {
                document.body.removeChild(scriptElement);
                isLoad = false;
            }
        }
        function StringFormat(str, ...args) {
            return str.replace(/{(\d+)}/g, (match, index) => args[index] ?? match);
        }
        var isLoad = false;
        var isLoadMap = false;

        // 动态加载脚本
        function loadScript(scriptId, scriptUrl) {
            unloadScript(scriptId); // 首先卸载现有脚本（如果存在）
            var script = document.createElement("script");
            script.id = scriptId;
            script.src = scriptUrl;
            document.body.appendChild(script);
            script.onload = function () {
                isLoad = true;
            };
        }

        function loadScriptMap(scriptUrl) {
            var script = document.createElement("script");
            script.src = scriptUrl;
            document.body.appendChild(script);
            script.onload = function () {
                isLoadMap = true;
            };
        }

        // 在水印添加完毕后调用此函数以重新加载脚本

            loadScript(

    </script>

            // Format datetime to string
            Date.prototype.format = function (fmt) {
                if (fmt.indexOf("HH:mm ") !== -1) {
                    fmt = fmt.replace("HH:mm ", "hh:mm:ss ");
                } else if (fmt.indexOf("H:mm ") !== -1) {
                    fmt = fmt.replace("H:mm ", "hh:mm:ss ");
                } else if (fmt.indexOf("tt hh:mm ") !== -1) {
                    fmt = fmt.replace("tt hh:mm ", "hh:mm:ss ");
                } else if (fmt.indexOf("tt h:mm ") !== -1) {
                    fmt = fmt.replace("tt h:mm ", "hh:mm:ss ");
                } else if (fmt.indexOf("HH:mm") !== -1) {
                    fmt = fmt.replace("HH:mm", "hh:mm");
                } else if (fmt.indexOf(" H:mm") !== -1) {
                    fmt = fmt.replace(" H:mm", " hh:mm");
                }

                var o = {
                    "M+": this.getMonth() + 1,
                    "d+": this.getDate(),
                    "h+": this.getHours(),
                    "m+": this.getMinutes(),
                    "s+": this.getSeconds(),
                    "q+": Math.floor((this.getMonth() + 3) / 3),
                    S: this.getMilliseconds(),
                };
                fmt = fmt || "yyyy-MM-dd";
                if (/(y+)/.test(fmt))
                    fmt = fmt.replace(
                        RegExp.$1,
                        (this.getFullYear() + "").substr(4 - RegExp.$1.length)
                    );
                for (var k in o)
                    if (new RegExp("(" + k + ")").test(fmt))
                        fmt = fmt.replace(
                            RegExp.$1,
                            RegExp.$1.length == 1
                                ? o[k]
                                : ("00" + o[k]).substr(("" + o[k]).length)
                        );
                return fmt;
            };

                            u8arr = new Uint8Array(n);
                        while (n--) {

                        }
                        let theBlob = new Blob([u8arr], {
                            type: mime,
                        });
                        return theBlob;

                    async convertBlobToBase64(blob) {
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();

                            reader.onloadend = () => resolve(reader.result);
                            reader.onerror = reject;

                            reader.readAsDataURL(blob);
                        });
                    },

                    IsMobilePhone() {
                        var sUserAgent = navigator.userAgent.toLowerCase();
                        var isMobile = false;
                        if (sUserAgent.match(/ipad/i) == "ipad") {
                            isMobile = true;
                        }
                        if (sUserAgent.match(/iphone os/i) == "iphone os") {
                            isMobile = true;
                        }
                        if (sUserAgent.match(/midp/i) == "midp") {
                            isMobile = true;
                        }
                        if (sUserAgent.match(/rv:1.2.3.4/i) == "rv:1.2.3.4") {
                            isMobile = true;
                        }
                        if (sUserAgent.match(/ucweb/i) == "ucweb") {
                            isMobile = true;
                        }
                        if (sUserAgent.match(/android/i) == "android") {
                            isMobile = true;
                        }
                        if (sUserAgent.match(/windows ce/i) == "windows ce") {
                            isMobile = true;
                        }
                        if (sUserAgent.match(/windows mobile/i) == "windows mobile") {
                            isMobile = true;
                        }
                        return isMobile;

                    // Triggered when the table cell 'File Name' is clicked
                    async handleFileNameClick(event, fileId) {
                        const generateUploadFileUrlRequest =
                            new GenerateUploadFileUrlRequest(
                                fileId,
                                this.entityId,
                                this.entityName
                            );
                        try {
                            const fileUrlData = await fetchData(
                                generateUploadFileUrlRequest
                            );
                            const fileUrl = fileUrlData.Result;

                            if (!this.isMobilePhone) {
                                Xrm.Navigation.openUrl(fileUrl);
                            } else {
                                const response = await fetch(fileUrl);
                                const reader = response.body.getReader();
                                const contentLength = response.headers.get("Content-Length");

                                const contentType = response.headers.get("Content-Type");
                                const fileName = decodeURIComponent(
                                    response.headers
                                        .get("Content-Disposition")
                                        .replace("attachment;filename*=UTF-8''", "")
                                );

                                let receivedLength = 0;
                                let chunks = [];
                                while (true) {
                                    const { done, value } = await reader.read();
                                    if (done) {
                                        break;
                                    }
                                    chunks.push(value);
                                    receivedLength += value.length;
                                    //显示下载进度
                                    Xrm.Utility.showProgressIndicator(
                                        `${receivedLength} of ${contentLength}`
                                    );
                                }

                                var base64Content = (
                                    await this.convertBlobToBase64(
                                        new Blob(chunks, { type: contentType })
                                    )
                                ).replace(`data:${contentType};base64,`, "");

                                Xrm.Utility.closeProgressIndicator();

                                Xrm.Navigation.openFile(
                                    {
                                        fileContent: base64Content,
                                        fileName: fileName,
                                        fileSize: contentLength / 1024,
                                        mimeType: contentType,
                                    },
                                    {
                                        openMode: 2,
                                    }
                                );
                            }
                        } catch (error) {
                            Xrm.Utility.closeProgressIndicator();
                            Xrm.Navigation.openAlertDialog(error.message);
                        }
                        //Xrm.Navigation.openUrl(fileUrl);
                    },

                    // Deprecated: Because we can't get upload progress from fetch api
                    async uploadFile2(file, fileUrl) {
                        let start = 0;
                        let size = 1024 * 1024 * 4;
                        while (true) {
                            let isBreak = false;
                            let end = start + size;
                            if (start + size >= file.size) {
                                end = file.size;
                                isBreak = true;
                            }

                            let subBlob = file.slice(start, end);
                            let strUtcTime = new Date().toUTCString();

                            let response = await fetch(fileUrl, {
                                method: "PUT",
                                headers: {
                                    "Content-Type": "application/octet-stream",
                                    "x-ms-version": strUtcTime,
                                    "x-ms-version": "2019-12-12",
                                },
                                body: subBlob,
                            });
                            if (!response.ok) {
                                throw new Error(`Error:${await response.text()}`);
                            }

                            start = start + size;
                            if (isBreak) {
                                break;
                            }
                        }
                    },

                    async uploadFile(file, fileUrl) {
                        let start = 0;
                        let size = 1024 * 1024 * 4;
                        let totalSize = file.size;
                        let preLoadedSize = 0;
                        let curLoadedSize = 0;
                        let vmInstance = this;

                        return new Promise((resolve, reject) => {
                            function sendChunk() {
                                let end = Math.min(start + size, totalSize);
                                let chunk = file.slice(start, end);
                                let xhr = new XMLHttpRequest();
                                let strUtcTime = new Date().toUTCString();
                                preLoadedSize = curLoadedSize;

                                // Track progress
                                xhr.upload.onprogress = function (event) {
                                    if (event.lengthComputable) {
                                        curLoadedSize = preLoadedSize + event.loaded;
                                        const percentComplete = (curLoadedSize / totalSize) * 100;
                                        //const percentComplete = (event.loaded / event.total) * 100;
                                        vmInstance.uploadPercentage = Math.floor(percentComplete);
                                    }
                                };

                                xhr.onreadystatechange = function () {
                                    if (xhr.readyState === XMLHttpRequest.DONE) {
                                        if (xhr.status >= 200 && xhr.status < 300) {
                                            start = end;

                                            if (start < totalSize) {
                                                sendChunk();
                                            } else {
                                                console.log("File upload completed!");
                                                resolve("File upload completed!");
                                            }
                                        } else {
                                            console.error(`Error: ${xhr.status}`);
                                            reject(`Error: ${xhr.status} - ${xhr.statusText}`);
                                        }
                                    }
                                };

                                xhr.open("PUT", fileUrl, true);
                                xhr.setRequestHeader(
                                    "Content-Type",
                                    "application/octet-stream"
                                );
                                xhr.setRequestHeader("x-ms-version", "2019-12-12");
                                xhr.setRequestHeader("x-ms-date", strUtcTime);
                                xhr.send(chunk);
                            }

                            sendChunk();
                        });
                    },

                    // Convert the table data to localized data for display according to the user's setting
                    async convertTableDataToLocal(rawData) {
                        let localTableData = [];
                        const userSettings = Xrm.Utility.getGlobalContext().userSettings;
                        const localTimeDiff = userSettings.getTimeZoneOffsetMinutes();
                        const dateFormat = `${userSettings.dateFormattingInfo.ShortDatePattern
                            } ${userSettings.dateFormattingInfo.ShortTimePattern.replace(
                                " tt",
                                ""
                            )}`;
                        for (let i = 0; i < rawData.length; i++) {
                            const row = rawData[i];
                            let localType = " ";
                            try {
                                localType = await commonService.getUserLanguageText(
                                    `${this.entityName}_filetype_${row.Type}`
                                );
                            } catch (e) {
                                localType = " ";
                            }

                            const localTime = await commonService.getUserLocalTime(
                                new Date(row.CreateTime)
                            );
                            const localTimeStr = localTime.format(dateFormat);

                            if (
                                ["mcs_spmorder", "mcs_invoiceapplicationorder"].includes(
                                    this.entityName
                                )
                            ) {
                                // 剔除099的虚假文件类型
                                if (row.Type != "099") {
                                    localTableData.push({
                                        ID: row.ID,
                                        Name: row.Name,
                                        Type: localType,
                                        TypeValue: row.Type,
                                        CreateTime: localTimeStr,
                                        UserName: row.UserName,
                                        FileName: getFileName(row.Name),
                                        FileExt: getFileExt(row.Name),
                                    });
                                }
                            } else {
                                localTableData.push({
                                    ID: row.ID,
                                    Name: row.Name,
                                    Type: localType,
                                    TypeValue: row.Type,
                                    CreateTime: localTimeStr,
                                    UserName: row.UserName,
                                    FileName: getFileName(row.Name),
                                    FileExt: getFileExt(row.Name),
                                });
                            }
                        }
                        return localTableData;
                    },

                    getPreviewUrl(fileName) {
                        if (!fileName) return;
                        // List of image MIME types
                        const imageMimeTypes = [
                            "jpg",
                            "jpeg",
                            "png",
                            "gif",
                            "bmp",
                            "webp",
                        ];
                        const docMimeTypes = ["doc", "docx"];
                        const pdfMimeTypes = ["pdf"];
                        const fileType = fileName.split(".").pop().toLowerCase();

                        // Check if the file's MIME type is in the list
                        if (imageMimeTypes.includes(fileType)) return "Preview.html";
                        else if (docMimeTypes.includes(fileType))
                            return "PreviewDoc.html";
                        else if (pdfMimeTypes.includes(fileType))
                            return "PreviewPdf.html";
                        else return "";
                    },
